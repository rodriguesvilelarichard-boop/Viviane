        '<label class="campo"><span>Peso total da receita pronta <span class="opc">(opcional)</span></span><span class="linha2" style="font-weight:400"><input data-f="pesoTotal" data-num inputmode="decimal" value="'+paraInput(d.pesoTotal)+'" placeholder="Ex.: 1,3" aria-label="Peso total">'+selPeso('data-f="pesoUn"',d.pesoUn)+'</span><small class="ajuda">Só precisa se também vende por peso. Pese tudo depois de pronto.</small></label></div>';
      }
      // 2 ingredientes
      h+='<div class="secao"><h3>2. Ingredientes</h3>';
      if(!ings.length) h+='<p class="aviso">Você ainda não tem ingredientes. Na lista abaixo, escolha <b>"➕ Cadastrar ingrediente novo"</b>.</p>';
      d.itens.forEach(function(it,i){
        var ing=ingPorId(it.ingId);
        var opts=ings.map(function(g){return '<option value="'+g.id+'"'+(g.id===it.ingId?' selected':'')+'>'+esc(g.nome)+'</option>';}).join('');
        h+='<div class="item"><div class="item-l1"><select data-lista="itens" data-i="'+i+'" data-f="ingId" aria-label="Ingrediente"><option value="">— escolha o ingrediente —</option>'+opts+'<option value="__novo">➕ Cadastrar ingrediente novo…</option></select>'+
          '<button class="x" type="button" data-acao="rem-item" data-i="'+i+'" aria-label="Tirar ingrediente">✕</button></div>'+
          '<div class="item-l2"><input data-lista="itens" data-i="'+i+'" data-f="qtd" data-num inputmode="decimal" placeholder="Qtd" aria-label="Quantidade" value="'+paraInput(it.qtd)+'"'+(ing?'':' disabled')+'>'+
          '<select data-lista="itens" data-i="'+i+'" data-f="unidade" aria-label="Medida"'+(ing?'':' disabled')+'>'+opcoesUnidade(ing,it.unidade)+'</select></div>'+
          '<span class="item-custo" id="ic-'+i+'"></span></div>';
      });
      h+='<button class="btn sec grande" type="button" data-acao="add-item">➕ Adicionar ingrediente</button></div>';
      // 3 gás
      h+='<div class="secao"><h3>3. Gás e energia</h3>'+
        '<label class="campo"><span>Quantas fornadas esta receita usa?</span><input data-f="fornadas" data-num inputmode="decimal" value="'+paraInput(d.fornadas)+'"><small class="ajuda">Quantas vezes vai ao forno (ou fogão) para fazer a receita inteira.</small></label>'+
        '<label class="campo"><span>Gás por fornada (R$)</span><span class="item-l1" style="font-weight:400"><input data-f="gas" data-num data-dinheiro inputmode="decimal" value="'+paraInput(d.gas,true)+'"><button class="btn sec peq" style="margin-left:8px;min-height:48px" type="button" data-acao="calc-gas">🧮 Calcular</button></span></label>'+
        '<label class="campo"><span>Energia/luz por fornada (R$)</span><span class="item-l1" style="font-weight:400"><input data-f="energia" data-num data-dinheiro inputmode="decimal" value="'+paraInput(d.energia,true)+'"><button class="btn sec peq" style="margin-left:8px;min-height:48px" type="button" data-acao="calc-energia">🧮 Calcular</button></span></label>'+
        '<p class="ajuda" id="gas-tot"></p></div>';
      // 4 perda
      h+='<div class="secao"><h3>4. Perda <span class="opc">(opcional)</span></h3><label class="campo"><span>'+(emKg?'De cada receita, quantos <b>kg</b> costumam sobrar sem vender (ou quebram)?':'De cada receita, quantas <span class="rn">'+rn()+'</span> costumam sobrar sem vender (ou quebram)?')+'</span><input data-f="perda" data-num inputmode="decimal" value="'+paraInput(d.perda)+'" placeholder="0"></label>'+
        '<small class="ajuda">'+(emKg?'Ex.: 0,2 para 200 gramas. ':'')+'O custo do que sobra é dividido entre o que você vende.</small></div>';
      // 5 formas
      h+='<div class="secao"><h3>5. Como você vende</h3><p class="ajuda">'+(emKg?'Ex.: 1 kg, meio quilo (0,5 kg), pacote de 300 g.':'Ex.: unidade, fatia, bolo inteiro, bandeja com 10, marmita de 500 g.')+'</p>';
      d.formas.forEach(function(f,i){
        h+='<div class="forma"><div class="item-l1"><input data-lista="formas" data-i="'+i+'" data-f="nome" list="dl-formas" value="'+esc(f.nome)+'" placeholder="Nome. Ex.: Bandeja com 10" aria-label="Nome da forma de venda">'+
          '<button class="x" type="button" data-acao="rem-forma" data-i="'+i+'" aria-label="Tirar forma de venda">✕</button></div>'+
          (emKg?'':'<div class="seg"><button type="button" data-acao="tipo" data-i="'+i+'" data-v="un" class="'+(f.tipo!=='peso'?'on':'')+'">Por quantidade</button><button type="button" data-acao="tipo" data-i="'+i+'" data-v="peso" class="'+(f.tipo==='peso'?'on':'')+'">Por peso</button></div>')+
          '<div class="grade-auto">'+((emKg||f.tipo==='peso')?
            '<label class="campo"><span>Quanto pesa?</span><span class="linha2" style="font-weight:400;grid-template-columns:1fr 88px"><input data-lista="formas" data-i="'+i+'" data-f="qtd" data-num inputmode="decimal" value="'+paraInput(f.qtd)+'" aria-label="Peso">'+selPeso('data-lista="formas" data-i="'+i+'" data-f="qtdUn"',f.qtdUn)+'</span></label>' :
            '<label class="campo"><span>Quantas <span class="rn">'+rn()+'</span> leva?</span><input data-lista="formas" data-i="'+i+'" data-f="qtd" data-num inputmode="decimal" value="'+paraInput(f.qtd)+'"></label>')+
          '<label class="campo"><span>Embalagem (R$)</span><input data-lista="formas" data-i="'+i+'" data-f="embalagem" data-num data-dinheiro inputmode="decimal" value="'+paraInput(f.embalagem,true)+'" placeholder="caixa, saquinho…"></label>'+
          '<label class="campo"><span>Preço de venda (R$)</span><input data-lista="formas" data-i="'+i+'" data-f="preco" data-num data-dinheiro inputmode="decimal" value="'+paraInput(f.preco,true)+'"></label></div>'+
          '<div class="previa" id="fp-'+i+'"></div></div>';
      });
      h+='<button class="btn sec grande" type="button" data-acao="add-forma">➕ Adicionar forma de venda</button></div>';
      if(orig) h+='<div class="botoes um"><button class="btn perigo" type="button" data-acao="excluir">🗑️ Excluir esta receita</button></div>';
      h+='</div>';
      h+='<div class="rodape"><div class="rodape-in"><div class="previa-rod" id="prev-rod"></div><div class="botoes"><button class="btn sec" type="button" data-acao="voltar">Cancelar</button><button class="btn" type="button" data-acao="salvar">💾 Salvar</button></div></div></div>';
      c.el.innerHTML=h;
      c.el.scrollTop=st;
      previa();
    }
    function previa(){
      var k=calcReceita(d);
      k.itens.forEach(function(x,i){
        var el=$('#ic-'+i,c.el); if(!el) return;
        if(!x.ing){ el.className='item-custo'; el.textContent=''; return; }
        if(x.prob){ el.className='item-custo prob'; el.textContent='⚠️ '+x.prob; return; }
        if((x.it.unidade==='kg'||x.it.unidade==='L') && num(x.it.qtd)>=30){ el.className='item-custo prob'; el.textContent='⚠️ '+fmtNum(x.it.qtd,2)+' '+x.it.unidade+'?? Se for '+(x.it.unidade==='kg'?'gramas, troque a medida para "g"':'ml, troque a medida para "ml"')+'. ('+R(x.custo)+')'; return; }
        el.className='item-custo';
        el.textContent= num(x.it.qtd)>0? '= '+fmtQtdBase(x.qb,dimDe(x.ing.unidade))+' → '+R(x.custo) : '';
      });
      var g=$('#gas-tot',c.el); if(g) g.innerHTML='Gás + energia desta receita: <b>'+R(k.gas+k.energia)+'</b>';
      k.formas.forEach(function(f,i){
        var el=$('#fp-'+i,c.el); if(!el) return;
        if(f.custo==null){ el.className='previa'; el.textContent=f.motivo; return; }
        el.className='previa '+f.st.c;
        el.innerHTML='Custa <b>'+R(f.custo)+'</b>'+(f.preco>0? ' · sobra <b>'+R(f.sobra)+'</b> ('+pct(f.pct)+') · <span class="tag '+f.st.c+'">'+f.st.t+'</span>' : ' · coloque o preço de venda');
      });
      var pr=$('#prev-rod',c.el);
      if(pr) pr.innerHTML='Receita inteira: <b>'+R(k.total)+'</b>'+(k.porUn!=null?(k.peso?' · cada kg: <b>'+R(k.porUn)+'</b>':' · '+esc(d.rendNome||'unidades')+': <b>'+R(k.porUn)+'</b> cada'):'');
    }
    render();
    if(!orig) setTimeout(function(){ var n=$('[data-f="nome"]',c.el); if(n) n.focus(); },50);

    function virarQuilos(){
      d.rendNome='unidades'; mudarTipo('peso');
      toast('Pronto: esta receita agora é em quilos');
    }
    function mudarTipo(tv){
      if(d.rendTipo===tv) return;
      d.rendTipo=tv;
      if(tv==='peso') d.formas.forEach(function(f){ if(f.tipo!=='peso'){ f.tipo='peso'; f.qtd=''; f.qtdUn='kg'; if(/^(unidade|fatia|forma \d+)$/i.test(String(f.nome).trim())) f.nome='1 kg', f.qtd=1; } });
      c.sujo=true; render();
    }
    function alvoDoEl(el){ var l=el.getAttribute('data-lista'); return l? d[l][+el.getAttribute('data-i')] : d; }
    c.el.addEventListener('input',function(e){
      var el=e.target, f=el.getAttribute('data-f'); if(!f||el.tagName==='SELECT') return;
      var obj=alvoDoEl(el); obj[f]= el.hasAttribute('data-num')? lerNum(el.value) : el.value;
      c.sujo=true;
      if(f==='rendNome' && /^\s*(quilos|kilos|kg|quilogramas)\s*$/i.test(d.rendNome)){ virarQuilos(); return; }
      if(f==='rendNome'){ var rs=c.el.querySelectorAll('.rn'); for(var i=0;i<rs.length;i++) rs[i].textContent=d.rendNome||'unidades'; }
      previa();
    });
    c.el.addEventListener('change',function(e){
      var el=e.target;
      if(el.getAttribute('data-f')==='rendNome' && /^\s*(kg|kgs|quilos?|kilos?|quilogramas?)\s*$/i.test(el.value)){ virarQuilos(); return; }
      if(el.tagName!=='SELECT') return;
      var f=el.getAttribute('data-f'), obj=alvoDoEl(el); c.sujo=true;
      if(f==='ingId'){
        if(el.value==='__novo'){
          var idx=+el.getAttribute('data-i');
          editarIngrediente(null,function(novo){ d.itens[idx].ingId=novo; d.itens[idx].unidade=unidadePadrao(ingPorId(novo)); },render);
          return;
        }
        obj.ingId=el.value; var ing=ingPorId(el.value);
        if(ing && !unidadeValida(ing,obj.unidade)) obj.unidade=unidadePadrao(ing);
        render();
        var q=c.el.querySelector('input[data-lista="itens"][data-i="'+el.getAttribute('data-i')+'"][data-f="qtd"]'); if(q) q.focus();
        return;
      }
      obj[f]=el.value; previa();
    });
    c.el.addEventListener('click',function(e){
      var b=e.target.closest('[data-acao]'); if(!b) return;
      var ac=b.getAttribute('data-acao'), i=+b.getAttribute('data-i');
      if(ac==='voltar') fecharCamada();
      else if(ac==='add-item'){ d.itens.push({ingId:'',qtd:'',unidade:''}); c.sujo=true; render(); var s=c.el.querySelectorAll('select[data-f="ingId"]'); if(s.length) s[s.length-1].focus(); }
      else if(ac==='rem-item'){ d.itens.splice(i,1); c.sujo=true; render(); }
      else if(ac==='add-forma'){ d.formas.push(d.rendTipo==='peso'? {id:novoId(),nome:'',tipo:'peso',qtdUn:'kg',qtd:'',embalagem:'',preco:''} : {id:novoId(),nome:'',tipo:'un',qtdUn:'g',qtd:1,embalagem:'',preco:''}); c.sujo=true; render(); }
      else if(ac==='rendTipo') mudarTipo(b.getAttribute('data-v'));
      else if(ac==='rem-forma'){ if(d.formas.length<=1 && !confirm('Tirar a única forma de venda?')) return; d.formas.splice(i,1); c.sujo=true; render(); }
      else if(ac==='tipo'){ var fm=d.formas[i]; var nv=b.getAttribute('data-v'); if(fm.tipo!==nv){ fm.tipo=nv; fm.qtd= nv==='peso'?'':1; if(nv==='peso') fm.qtdUn='g'; c.sujo=true; render(); } }
      else if(ac==='calc-gas') calcGas(function(v){ d.gas=v; c.sujo=true; var el=$('[data-f="gas"]',c.el); if(el) el.value=paraInput(v,true); previa(); });
      else if(ac==='calc-energia') calcEnergia(function(v){ d.energia=v; c.sujo=true; var el=$('[data-f="energia"]',c.el); if(el) el.value=paraInput(v,true); previa(); });
      else if(ac==='excluir'){
        if(!confirm('Excluir a receita "'+orig.nome+'"? Não dá para desfazer.')) return;
        S.receitas=S.receitas.filter(function(r){return r.id!==orig.id;}); delete S.cardapio[orig.id];
        salvar(); c.sujo=false; salvou=true; fecharCamada(); toast('Receita excluída');
      }
      else if(ac==='salvar') salvarReceita();
    });
    function salvarReceita(){
      d.nome=String(d.nome||'').trim(); d.rendNome=String(d.rendNome||'').trim()||'unidades';
      var erros=[];
      if(!d.nome) erros.push('Escreva o nome do produto.');
      if(!(num(d.rendimento)>0)) erros.push(d.rendTipo==='peso'?'Diga quantos kg a receita rende (item 1).':'Diga quanto a receita rende (item 1).');
      if(d.rendTipo==='peso'){ d.formas.forEach(function(f){ f.tipo='peso'; }); if(num(d.rendimento)>=100 && !confirm('A receita rende mesmo '+fmtNum(d.rendimento,2)+' QUILOS?\n\nSe você quis dizer gramas, toque em Cancelar e escreva em kg (ex.: 800 g = 0,8).')){ render(); return; } }
      d.itens=d.itens.filter(function(it){return it.ingId;});
      if(!d.itens.length) erros.push('Coloque pelo menos um ingrediente (item 2).');
      d.itens.forEach(function(it){ if(!(num(it.qtd)>0)){ var g=ingPorId(it.ingId); erros.push('Falta a quantidade de '+(g?g.nome:'um ingrediente')+'.'); } });
      var exag=d.itens.filter(function(it){ return (it.unidade==='kg'||it.unidade==='L') && num(it.qtd)>=30; });
      if(exag.length && !confirm('Confira: '+exag.map(function(it){ var g=ingPorId(it.ingId); return fmtNum(it.qtd,2)+' '+it.unidade+' de '+(g?g.nome:'?'); }).join(', ')+'.\n\nÉ isso mesmo? Se era em gramas/ml, toque em Cancelar e troque a medida.')){ render(); return; }
      if(num(d.perda)>=num(d.rendimento) && num(d.rendimento)>0) erros.push('A perda não pode ser igual ou maior que o rendimento.');
      d.formas.forEach(function(f,i){ if(!String(f.nome).trim()) f.nome= f.tipo==='peso'? (num(f.qtd)>0? fmtPesoForma(f):'Por peso') : 'Forma '+(i+1); });
      if(d.rendTipo!=='peso' && d.formas.some(function(f){return f.tipo==='peso';}) && !(num(d.pesoTotal)>0)) erros.push('Você vende por peso: informe o peso total da receita pronta (item 1).');
      if(erros.length){ render(); alert('Quase lá! Falta:\n\n• '+erros.join('\n• ')); return; }
      if(orig){ var pos=S.receitas.indexOf(orig); S.receitas[pos]=d; } else S.receitas.push(d);
      salvar(); c.sujo=false; salvou=true; fecharCamada(); toast('Receita salva ✓');
    }
  });
}

/* ================== RESULTADO DE UM PRODUTO ================== */
function abrirResultado(id){
  abrirCamada('pagina',function(c){
    c.aoFechar=renderTela;
    function render(){
      var r=recPorId(id); if(!r) return;
      var k=calcReceita(r);
      var unNome=(r.rendNome||'unidades');
      var h='<div class="topo"><button class="btn peq" type="button" data-acao="voltar">← Voltar</button><h2>'+esc(r.nome)+'</h2></div><div class="corpo">';
      h+='<button class="btn grande sec" type="button" data-acao="editar">✏️ Editar receita (ingredientes, preços…)</button>';
      h+='<div class="secao"><h3>Quanto custa fazer a receita inteira</h3><div class="big">'+R(k.total)+'</div>'+
        '<p class="ajuda">Ingredientes '+R(k.ingTotal)+' + gás '+R(k.gas)+' + energia '+R(k.energia)+'</p>';
      if(k.peso && k.porUn!=null) h+='<p>Cada <b>quilo</b> custa <b>'+R(k.porUn)+'</b> <span class="ajuda">('+R(k.total)+' ÷ '+fmtNum(k.util,3)+' kg'+(k.perda>0?' que você vende':'')+'), sem embalagem</span></p>';
      else if(k.porUn!=null) h+='<p>Cada uma das <b>'+fmtNum(k.util,2)+' '+esc(unNome)+'</b>'+(k.perda>0?' que você vende':'')+' custa <b>'+R(k.porUn)+'</b> <span class="ajuda">('+R(k.total)+' ÷ '+(k.perda>0?'('+fmtNum(k.rend,2)+' − '+fmtNum(k.perda,2)+' de perda)':fmtNum(k.rend,2))+'), sem embalagem</span></p>';
      if(k.porG!=null) h+='<p>Cada 100 g custa <b>'+R(k.porG*100)+'</b>, sem embalagem</p>';
      h+='<details><summary>Ver o custo de cada ingrediente</summary><ul class="lista-simples">';
      k.itens.forEach(function(x){
        if(!x.ing) return;
        h+='<li><span>'+esc(x.ing.nome)+'<br><span class="ajuda">'+fmtNum(x.it.qtd,3)+' '+rotUn(x.it.unidade,num(x.it.qtd))+(CASEIRAS[x.it.unidade]?' ('+fmtQtdBase(x.qb,dimDe(x.ing.unidade))+')':'')+(x.prob?' ⚠️ '+esc(x.prob):'')+'</span></span><span class="num">'+R(x.custo)+'</span></li>';
      });
      h+='<li><span>Gás ('+fmtNum(k.fornadas,2)+' fornada'+(k.fornadas>=2?'s':'')+')</span><span class="num">'+R(k.gas)+'</span></li>';
      h+='<li><span>Energia</span><span class="num">'+R(k.energia)+'</span></li><li class="total"><span>Total</span><span class="num">'+R(k.total)+'</span></li></ul></details></div>';
      h+='<h3 style="margin-top:18px">Preço x custo</h3>';
      h+='<div id="res-formas">'+htmlFormas(r,k)+'</div>';
      h+='<div class="secao"><h3>💡 Preço sugerido</h3><label class="campo"><span>Quanto você quer que sobre do preço? (%)</span><input inputmode="decimal" id="alvo" value="'+paraInput(k.alvo)+'"></label>'+
        '<small class="ajuda">Ex.: 40% quer dizer que de cada R$ 10,00 vendidos, R$ 4,00 sobram para você.</small><div id="res-sug">'+htmlSugestoes(r,k)+'</div></div>';
      h+='<div id="res-como">'+htmlComoCalcula(r,k)+'</div>';
      h+='</div>';
      c.el.innerHTML=h;
    }
    function htmlFormas(r,k){
      if(!k.formas.length) return '<p class="aviso">Nenhuma forma de venda. Toque em "Editar receita" e adicione.</p>';
      return k.formas.map(function(f){
        var s='<div class="card forma-res st-'+f.st.c+'"><div class="cab"><span class="titulo">'+esc(f.f.nome)+'</span><span class="tag '+f.st.c+'">'+f.st.t+'</span></div>';
        if(f.custo==null) return s+'<p>'+esc(f.motivo)+'</p></div>';
        s+='<ul class="lista-simples"><li><span>Custo do produto <span class="ajuda">('+((k.peso||f.f.tipo==='peso')?fmtPesoForma(f.f):fmtNum(f.f.qtd,2)+' '+esc(num(f.f.qtd)<2?singular(r.rendNome):r.rendNome))+')</span></span><span class="num">'+R(f.custoProduto)+'</span></li>'+
          '<li><span>Embalagem</span><span class="num">'+R(num(f.f.embalagem))+'</span></li>'+
          '<li class="total"><span>Custo total</span><span class="num">'+R(f.custo)+'</span></li>'+
          '<li><span>Preço que você cobra</span><span class="num">'+(f.preco>0?R(f.preco):'—')+'</span></li></ul>';
        if(f.preco>0) s+='<div class="sobra-box"><span><b>Quanto sobra pra você</b><br><span class="tec">margem de contribuição</span></span><span class="num"><span class="big '+(f.sobra<0?'verm-tx':f.st.c==='verde'?'verde-tx':'amar-tx')+'">'+R(f.sobra)+'</span><br><b>'+pct(f.pct)+'</b> do preço</span></div>';
        return s+'</div>';
      }).join('');
    }
    function htmlComoCalcula(r,k){
            var h='<div class="secao"><h3>📘 Como chegamos nesses números</h3>';
      // passo 1
      h+='<p class="passo">1. Quanto custa a receita inteira</p><div class="conta">Ingredientes '+R(k.ingTotal)+
        '<br>+ gás '+R(k.gas)+(k.fornadas!==1?' <span class="ajuda" style="display:inline">('+fmtNum(k.fornadas,2)+' fornadas × '+R(num(r.gas))+')</span>':'')+
        '<br>+ energia '+R(k.energia)+'<span class="res">= <b>'+R(k.total)+'</b></span></div>';
      var ex=null; for(var j=0;j<k.itens.length;j++){ if(k.itens[j].ing && k.itens[j].custo>0){ ex=k.itens[j]; break; } }
      h+='<p class="ajuda">Cada ingrediente = (quantidade usada ÷ tamanho da embalagem) × preço pago.';
      if(ex){ var u0=ex.ing.unidade, f0=UN[u0].f, ul=(u0==='un'?'un.':u0); h+='<br>Ex.: <b>'+esc(ex.ing.nome)+'</b>: '+fmtNum(ex.qb/f0,3)+' '+ul+' ÷ '+fmtNum(ex.ing.qtdEmb,3)+' '+ul+' × '+R(ex.ing.preco)+' = <b>'+R(ex.custo)+'</b>'; }
      h+='</p>';
      // passo 2
      var porKg = k.porG!=null? k.porG*1000 : null;
      if(k.peso){
        h+='<p class="passo">2. Quanto custa cada quilo</p><div class="conta">'+R(k.total)+' ÷ '+fmtNum(k.util,3)+' kg'+
          (k.perda>0?' <span class="ajuda" style="display:inline">(rende '+fmtNum(k.rend,3)+' kg − '+fmtNum(k.perda,3)+' kg de perda)</span>':'')+
          '<span class="res">= <b>'+(k.porUn!=null?R(k.porUn)+' o quilo':'—')+'</b></span></div>';
      } else {
        h+='<p class="passo">2. Quanto custa cada uma das '+esc(r.rendNome||'unidades')+'</p><div class="conta">'+R(k.total)+' ÷ '+fmtNum(k.util,2)+' '+esc(r.rendNome||'unidades')+
          (k.perda>0?' <span class="ajuda" style="display:inline">(rende '+fmtNum(k.rend,2)+' − '+fmtNum(k.perda,2)+' de perda)</span>':'')+
          '<span class="res">= <b>'+(k.porUn!=null?R(k.porUn)+' cada':'—')+'</b></span></div>';
        if(porKg!=null && k.formas.some(function(f){return f.f.tipo==='peso';}))
          h+='<div class="conta">Por peso: '+R(k.total)+' ÷ '+fmtNum(k.pesoUtil/1000,3)+' kg<span class="res">= <b>'+R(porKg)+' o quilo</b></span></div>';
      }
      if(k.perda>0) h+='<p class="ajuda">A perda entra na divisão: o que você vende paga também o que sobrou.</p>';
      // passo 3 e 4 por forma de venda
      k.formas.forEach(function(f){
        h+='<p class="passo">3. '+esc(f.f.nome||'Forma de venda')+'</p>';
        if(f.custo==null){ h+='<p class="aviso">'+esc(f.motivo)+'</p>'; return; }
        var porPeso = k.peso || f.f.tipo==='peso';
        var emb=num(f.f.embalagem);
        h+='<div class="conta">'+(porPeso? R(porKg)+' o quilo × '+fmtNum(gramasForma(f.f)/1000,3)+' kg' : R(k.porUn)+' × '+fmtNum(f.f.qtd,2)+' '+esc(r.rendNome||'unidades'))+
          ' = '+R(f.custoProduto)+'<br>+ embalagem '+R(emb)+'<span class="res">= <b>custo '+R(f.custo)+'</b></span></div>';
        if(!(emb>0)) h+='<p class="aviso">⚠️ A embalagem está R$ 0,00. Pote, tampa, saquinho, etiqueta e sacola também custam.</p>';
        if(!(f.preco>0)){ h+='<p class="ajuda">Coloque o preço de venda para ver quanto sobra.</p>'; return; }
        var mk = f.custo>0? f.sobra/f.custo*100 : null;
        h+='<div class="conta">Sobra = '+R(f.preco)+' − '+R(f.custo)+' = <b>'+R(f.sobra)+'</b><br>% = '+R(f.sobra)+' ÷ '+R(f.preco)+' = <b>'+pct(f.pct)+' do preço</b>'+
          '<span class="res"><span class="tag '+f.st.c+'">'+f.st.t+'</span></span></div>';
        h+='<p>De cada <b>'+R(f.preco)+'</b> que entram, <b>'+R(f.custo)+'</b> voltam para ingredientes, gás e embalagem, e <b>'+R(f.sobra)+'</b> ficam com você.</p>';
        if(mk!=null) h+='<p class="ajuda">Atenção: os '+pct(f.pct)+' são sobre o <b>preço</b>. Sobre o custo seria '+pct(mk)+' ('+R(f.sobra)+' ÷ '+R(f.custo)+'). Não confunda: "custo + '+pct(f.pct)+'" daria '+R(f.custo*(1+f.pct/100))+', um preço menor.</p>';
      });
      // cores
      var mn=num(S.config.sobraMinima);
      h+='<p class="passo">As cores</p><p class="ajuda">🟢 Verde: sobra '+pct(k.alvo)+' do preço ou mais<br>🟡 Amarelo: sobra entre '+pct(mn)+' e '+pct(k.alvo)+'<br>🔴 Vermelho: sobra menos de '+pct(mn)+' ou dá prejuízo</p>';
      h+='<p class="aviso info">Lembre: a "sobra" ainda precisa pagar <b>o seu trabalho</b> e as outras contas (transporte, taxas, aluguel…).</p>';
      h+='<p class="tec">Os valores aparecem arredondados; pode haver diferença de 1 centavo.</p></div>';
      return h;
    }
    function htmlSugestoes(r,k){
      if(k.alvo>=100) return '<p class="aviso erro">Use um número menor que 100.</p>';
      return k.formas.map(function(f,i){
        if(f.custo==null) return '';
        var p=precoSugerido(f.custo,k.alvo), a=arredonda(p);
        return '<div class="sug"><b>'+esc(f.f.nome)+'</b>: cobrar <b>'+R(p)+'</b> → arredondado <b>'+R(a)+'</b>'+
          (f.preco>0?'<br><span class="ajuda">hoje você cobra '+R(f.preco)+'</span>':'')+
          (Math.abs(a-f.preco)>=0.005?'<div style="margin-top:6px"><button class="btn peq" type="button" data-acao="usar-preco" data-i="'+i+'" data-v="'+a+'">Usar '+R(a)+'</button></div>':' <span class="tag verde">já é o seu preço</span>')+'</div>';
      }).join('');
    }
    render();
    c.render=render;
    c.el.addEventListener('input',function(e){
      if(e.target.id!=='alvo') return;
      var r=recPorId(id); if(!r) return;
      var v=lerNum(e.target.value); r.sobraAlvo= (v===''||v===num(S.config.sobraDesejada))? '' : v;
      salvar();
      var k=calcReceita(r); if(v!=='') k.alvo=v;
      $('#res-formas',c.el).innerHTML=htmlFormas(r,k); $('#res-sug',c.el).innerHTML=htmlSugestoes(r,k); $('#res-como',c.el).innerHTML=htmlComoCalcula(r,k);
    });
    c.el.addEventListener('click',function(e){
      var b=e.target.closest('[data-acao]'); if(!b) return; var ac=b.getAttribute('data-acao');
      if(ac==='voltar') fecharCamada();
      else if(ac==='editar') editarReceita(id,{aoFechar:function(){ if(!recPorId(id)) setTimeout(fecharCamada,0); else render(); }});
      else if(ac==='usar-preco'){
        var r=recPorId(id); var i=+b.getAttribute('data-i'), v=num(b.getAttribute('data-v'));
        if(!confirm('Mudar o preço de "'+r.formas[i].nome+'" para '+R(v)+'?')) return;
        r.formas[i].preco=v; salvar(); render(); toast('Preço atualizado ✓');
      }
    });
  });
}

/* ================== BACKUP ================== */
function dadosBackup(){ return JSON.stringify({app:'custo-cozinha',versao:1,exportadoEm:new Date().toISOString(),dados:S},null,1); }
function nomeBackup(){ var d=new Date(); return 'backup-cozinha-'+hoje()+'-'+('0'+d.getHours()).slice(-2)+('0'+d.getMinutes()).slice(-2)+'.json'; }
function marcarBackup(){ S.ultimoBackup=Date.now(); gravar(true); }
function baixarBackup(){
  var nome=nomeBackup(), txt=dadosBackup();
  try{
    var blob=new Blob([txt],{type:'application/json'});
    if(window.navigator.msSaveOrOpenBlob){ window.navigator.msSaveOrOpenBlob(blob,nome); }
    else {
      var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=nome; a.style.display='none';
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); if(a.parentNode) a.parentNode.removeChild(a); },2000);
    }
    marcarBackup();
    alert('Pronto! O arquivo "'+nome+'" foi salvo na pasta Downloads (Transferências).\n\nAgora mande esse arquivo para o outro aparelho (WhatsApp, e-mail ou pendrive).');
  }catch(e){ alert('Não consegui salvar o arquivo neste navegador. Tente pelo botão "Enviar backup" ou use o Chrome.'); }
}
function podeCompartilhar(){
  try{ return !!(navigator.canShare && window.File && navigator.canShare({files:[new File(['{}'],'t.json',{type:'application/json'})]})); }catch(e){ return false; }
}
function compartilharBackup(){
  var f=new File([dadosBackup()],nomeBackup(),{type:'application/json'});
  navigator.share({files:[f],title:'Backup Custo da Cozinha'}).then(function(){ marcarBackup(); toast('Backup enviado ✓'); }).catch(function(e){ if(e && e.name==='AbortError') return; baixarBackup(); });
}
function importarArquivo(file,aoTerminar){
  var fr=new FileReader();
  fr.onload=function(){
    var o;
    try{ o=JSON.parse(fr.result); }catch(e){ alert('Esse arquivo não é um backup deste aplicativo.'); return; }
    var dados= o && o.dados ? o.dados : o;
    if(!dados || !Array.isArray(dados.ingredientes) || !Array.isArray(dados.receitas)){ alert('Esse arquivo não é um backup deste aplicativo.'); return; }
    var quando= o.exportadoEm? new Date(o.exportadoEm).toLocaleString('pt-BR') : 'data desconhecida';
    if(!confirm('Backup de '+quando+'\n'+dados.ingredientes.length+' ingredientes, '+dados.receitas.length+' receitas e '+(Array.isArray(dados.compras)?dados.compras.length:0)+' compras.\n\nIsso vai SUBSTITUIR tudo o que está neste aparelho. Continuar?')) return;
    S=migrar(dados); S.ultimoBackup=Date.now(); S.alteradoEm=S.ultimoBackup; gravar(true);
    renderTela(); toast('Backup restaurado ✓'); if(aoTerminar) aoTerminar();
  };
  fr.onerror=function(){ alert('Não consegui ler o arquivo.'); };
  fr.readAsText(file);
}
function abrirBackup(){
  abrirCamada('pagina',function(c){
    c.aoFechar=renderTela;
    function render(){
      var ult=S.ultimoBackup? new Date(S.ultimoBackup).toLocaleString('pt-BR') : null;
      var h='<div class="topo"><button class="btn peq" type="button" data-acao="voltar">← Voltar</button><h2>Backup e ajustes</h2></div><div class="corpo">';
      h+= backupPendente()? '<div class="aviso">⚠️ Você tem mudanças que ainda não estão no backup.'+(ult?' Último backup: '+ult+'.':' Você ainda não fez nenhum backup.')+'</div>' : '<div class="aviso ok">✅ Backup em dia'+(ult?' (último: '+ult+')':'')+'.</div>';
      h+='<div class="secao"><h3>Passar os dados para outro aparelho</h3><ol class="passos"><li>Aqui, toque em <b>Salvar backup</b>. Vai baixar um arquivo.</li><li>Mande esse arquivo para o outro aparelho (WhatsApp, e-mail ou pendrive).</li><li>No outro aparelho, abra este app, toque em <b>💾 Backup</b> → <b>Abrir backup</b> e escolha o arquivo.</li></ol>'+
        '<div class="pilha"><button class="btn grande" type="button" data-acao="baixar">⬇️ Salvar backup (baixar arquivo)</button>'+
        (podeCompartilhar()?'<button class="btn grande sec" type="button" data-acao="compartilhar">📤 Enviar backup (WhatsApp, e-mail…)</button>':'')+
        '<button class="btn grande sec" type="button" data-acao="abrir">📂 Abrir backup de outro aparelho</button></div>'+
        '<input type="file" id="arq" class="esconde"></div>';
      h+='<div class="secao"><h3>📲 Instalar no celular</h3>'+
        (instalado()? '<p class="aviso ok">✅ Você está usando o app instalado.</p>' :
          (promptInstalar? '<button class="btn grande" type="button" data-acao="instalar">📲 Instalar o app</button>' : '')+
          (/^https?:$/.test(location.protocol)?
            '<p class="ajuda"><b>Android (Chrome):</b> toque nos 3 pontinhos ⋮ no canto de cima → <b>Instalar app</b> (ou "Adicionar à tela inicial").<br><b>iPhone (Safari):</b> toque em Compartilhar ⬆️ → <b>Adicionar à Tela de Início</b>.</p>' :
            '<p class="ajuda">Você está usando o arquivo. Para instalar como app, abra pelo endereço da internet que te passaram.</p>'))+
        '</div>';
      h+='<p class="tec" style="text-align:center">Custo da Cozinha · versão 2 (fluxo simplificado)</p>';
      h+='<div class="secao"><h3>Onde ficam seus dados?</h3><p class="ajuda">Só neste aparelho, dentro deste navegador. Nada vai para a internet. Se você limpar os dados do navegador ou trocar de celular, eles somem. <b>Por isso faça backup toda semana.</b></p></div>';
      h+='<div class="secao"><h3>Cores do alerta</h3><p class="ajuda">Verde quando sobra pelo menos <b>'+fmtNum(S.config.sobraDesejada,0)+'%</b> · vermelho quando sobra menos de <b>'+fmtNum(S.config.sobraMinima,0)+'%</b>. Para mudar, vá em <b>Resumo</b>.</p></div>';
      h+='<div class="secao"><h3>Apagar</h3><div class="pilha">'+
        '<button class="btn perigo" type="button" data-acao="apagar-tudo">Apagar TUDO deste aparelho</button></div></div>';
      h+='</div>';
      c.el.innerHTML=h;
    }
    render();
    c.el.addEventListener('click',function(e){
      var b=e.target.closest('[data-acao]'); if(!b) return; var ac=b.getAttribute('data-acao');
      if(ac==='voltar') fecharCamada();
      else if(ac==='baixar'){ baixarBackup(); render(); }
      else if(ac==='instalar') instalar();
      else if(ac==='compartilhar') compartilharBackup();
      else if(ac==='abrir'){ var i=$('#arq',c.el); i.value=''; i.click(); }
      else if(ac==='apagar-exemplo'){ apagarExemplo(); render(); }
      else if(ac==='apagar-tudo'){
        if(!confirm('Apagar TODOS os ingredientes, receitas e o cardápio deste aparelho?')) return;
        if(!confirm('Tem certeza? Só dá para recuperar se você tiver um backup.')) return;
        var cfg=S.config; S=estadoVazio(); S.config=cfg; salvar(); render(); toast('Tudo apagado');
      }
    });
    c.el.addEventListener('change',function(e){ if(e.target.id==='arq' && e.target.files && e.target.files[0]) importarArquivo(e.target.files[0],render); });
  });
}

/* ================== INÍCIO ================== */
/* ================== APP INSTALÁVEL (quando aberto pela internet) ================== */
var promptInstalar=null, instalarDispensado=false;
function instalado(){ try{ return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone===true; }catch(e){ return false; } }
function instalar(){
  if(!promptInstalar){ alert('No Chrome: toque nos 3 pontinhos ⋮ no canto de cima e escolha "Instalar app" ou "Adicionar à tela inicial".'); return; }
  promptInstalar.prompt();
  promptInstalar.userChoice.then(function(){ promptInstalar=null; atualizarAvisos(); }, function(){});
}
window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); promptInstalar=e; atualizarAvisos(); });
window.addEventListener('appinstalled',function(){ promptInstalar=null; atualizarAvisos(); toast('App instalado ✓ Procure o ícone na tela do celular.'); });
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
}

carregar();
renderTela();
// Expor para testes
window.__cc={get S(){return S;},calcReceita:calcReceita,calcCompras:calcCompras};
})();
